# Builds the Python wheels and attaches them to a GitHub Release, so users can
# install CORVID without Rust or a C compiler. Nothing goes to PyPI.
#
# Pushing a tag v* builds that tag and creates its release. Running the
# workflow by hand ("Run workflow" on the Actions tab) builds without
# releasing, or, given a tag, builds that tag and attaches the wheels to its
# release, creating the release if needed.
name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.5.2. Empty: build only."
        required: false
        default: ""

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  wheel:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin, test: true }
          # Intel Macs: cross-compiled, not run here.
          - { name: macos-x86_64, os: macos-15, target: x86_64-apple-darwin, test: false }
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, test: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, test: true }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One abi3 wheel per platform serves Python 3.9 and later.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      # Solves an EMerge waveguide problem (tests/data) with GMRES, COCG and a
      # two-point sweep. Run from outside the checkout so the installed wheel is
      # imported, not the source tree.
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/test_wheel.py"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    needs: [wheel, sdist]
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CORVID ${{ env.TAG }}
          files: dist/*
          body: |
            Install without Rust or a compiler (macOS, Linux and Windows, Python 3.9 or later):

            ```
            pip install corvid-solver --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/${{ env.TAG }}
            ```
