[package]
name = "corvid"
version = "0.5.3"
edition = "2021"
authors = ["Robert Fennis"]
license = "AGPL-3.0-or-later"
description = "Iterative solver for time-harmonic Maxwell systems on second-order Nedelec elements"
repository = "https://github.com/FennisRobert/Corvid"
readme = "README.md"
publish = false

[lib]
name = "_kernels"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
rayon = "1.10"
num-complex = "0.4"
# SPARTA 0.3.9 (the sparta-solver release on PyPI), CPU backend only: CORVID never uses SPARTA's GPU
# path. Its dense kernels are compiled in (SpartaBLAS; Accelerate on Macs without SME).
sparta = { package = "sparta-solver", git = "https://github.com/FennisRobert/SPARTA", tag = "v0.3.9", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
