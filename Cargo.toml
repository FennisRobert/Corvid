[package]
name = "corvid"
version = "0.5.0"
edition = "2021"
authors = ["Robert Fennis"]
license = "AGPL-3.0-or-later"
description = "Iterative solver for time-harmonic Maxwell systems on second-order Nedelec elements"
repository = "https://github.com/FennisRobert/Corvid"
readme = "README.md"
publish = false

[lib]
name = "_kernels"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
rayon = "1.10"
num-complex = "0.4"
sparta = { package = "sparta-solver", git = "https://github.com/FennisRobert/SPARTA", rev = "a178949" }

[profile.release]
lto = "fat"
codegen-units = 1
